name: Bug report
description: Report a reproducible defect in the supervisor, workflow, or docs
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, tokens, or private
        repository contents. For a suspected vulnerability, follow
        [SECURITY.md](https://github.com/abdullah72005/abdullah-orchestrator/blob/main/SECURITY.md)
        instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit SHA, or `SUPERVISOR_VERSION` from a run
      placeholder: "v3.0.0 / d80bea0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Codex/Claude CLI, OpenCode version, host or WSL
      placeholder: |
        Ubuntu 22.04 on WSL2
        Python 3.10.12
        Codex CLI 0.169.0
        OpenCode 2.2.7 (Go)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behavior, including the exact stage and run state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, goal text, plan checks, or a minimal test
      placeholder: |
        python3 scripts/orchestrator.py doctor --project /abs/repo
        # then ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Redacted status/recap output, log tails, or a failing test name
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, tokens, and private data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
